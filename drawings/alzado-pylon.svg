<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#0e1114"/>
  <style>
    .t { fill:#e8edf1; font: 600 18px Segoe UI, sans-serif; }
    .s { fill:#8b959e; font: 12px Segoe UI, sans-serif; }
    .d { fill:#3ee0d8; font: 11px Segoe UI, sans-serif; }
    .l { stroke:#3ee0d8; stroke-width:1; fill:none; }
    .b { fill:#2a3036; stroke:#5c636a; stroke-width:1.2; }
    .a { fill:#b9bec4; }
    .g { fill:#161a1e; }
    .c { fill:#3ee0d8; }
  </style>
  <text x="40" y="40" class="t">AETHER Pylon  alzado y perfil · mm</text>
  <text x="40" y="60" class="s">Ingreso izquierda · Salida derecha · Perfil centro. Isla no dibujada. Z=0 = tapa de isla.</text>

  <!-- INGRESO -->
  <g transform="translate(180,820)">
    <text x="0" y="-790" class="s">INGRESO</text>
    <rect class="b" x="-90" y="-1620" width="180" height="1530"/>
    <rect class="b" x="-90" y="-90" width="180" height="90"/>
    <rect class="a" x="-70" y="-1440" width="140" height="520"/>
    <rect class="g" x="-50" y="-1332" width="100" height="62"/>
    <circle class="c" cx="0" cy="-1140" r="16" fill="#e8a020"/>
    <rect class="g" x="-45" y="-1048" width="90" height="16"/>
    <rect class="a" x="-60" y="-1068" width="120" height="8"/>
    <rect class="c" x="-90" y="-1500" width="6" height="1200"/>
    <rect class="a" x="-78" y="-1450" width="156" height="8"/>
    <line class="l" x1="110" y1="0" x2="110" y2="-1620"/>
    <text class="d" x="118" y="-810">1620</text>
    <line class="l" x1="110" y1="0" x2="110" y2="-1040"/>
    <text class="d" x="118" y="-520">slot 1040</text>
    <text class="d" x="118" y="-1140">botón 1140</text>
    <text class="d" x="118" y="-1280">LCD 1280</text>
    <line class="l" x1="-90" y1="30" x2="90" y2="30"/>
    <text class="d" x="-18" y="48">360</text>
  </g>

  <!-- PERFIL -->
  <g transform="translate(560,820)">
    <text x="-40" y="-790" class="s">PERFIL (conductor a la derecha)</text>
    <rect class="b" x="-150" y="-1620" width="300" height="1530"/>
    <rect class="b" x="-150" y="-90" width="300" height="90"/>
    <polygon class="a" points="-20,-1450 150,-1450 150,-1442 -20,-1442"/>
    <rect class="g" x="120" y="-1440" width="20" height="520"/>
    <line class="l" x1="-150" y1="30" x2="150" y2="30"/>
    <text class="d" x="-18" y="48">300</text>
  </g>

  <!-- SALIDA -->
  <g transform="translate(940,820)">
    <text x="0" y="-790" class="s">SALIDA</text>
    <rect class="b" x="-90" y="-1620" width="180" height="1530"/>
    <rect class="b" x="-90" y="-90" width="180" height="90"/>
    <rect class="a" x="-70" y="-1440" width="140" height="520"/>
    <rect class="g" x="-50" y="-1332" width="100" height="62"/>
    <rect class="g" x="-45" y="-1123" width="90" height="46"/>
    <rect class="c" x="-55" y="-1131" width="110" height="62" fill="none" stroke="#3ee0d8"/>
    <rect fill="#e8a020" x="84" y="-1500" width="6" height="1200"/>
    <rect class="a" x="-78" y="-1450" width="156" height="8"/>
    <line class="l" x1="110" y1="0" x2="110" y2="-1100"/>
    <text class="d" x="118" y="-550">ventana 1100</text>
    <text class="d" x="118" y="-1280">LCD 1280</text>
    <line class="l" x1="-90" y1="30" x2="90" y2="30"/>
    <text class="d" x="-18" y="48">360</text>
