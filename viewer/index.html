<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AETHER Splice — visor 3D</title>
  <style>
    :root {
      --bg: #1a2430;
      --panel: rgba(22, 30, 40, 0.9);
      --line: #3d4d5c;
      --text: #f2f6f8;
      --muted: #a8b4bf;
      --accent: #3ee0d8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    #view { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .bar, .spec {
      position: fixed; z-index: 2; top: 16px;
      background: var(--panel); border: 1px solid var(--line);
      padding: 14px 16px; backdrop-filter: blur(10px); max-height: calc(100% - 32px); overflow: auto;
    }
    .bar { left: 16px; width: 276px; }
    .spec { right: 16px; width: 248px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button.opt {
      flex: 1; background: #121820; color: var(--text); border: 1px solid var(--line);
      padding: 8px 6px; cursor: pointer; font-size: 12px;
    }
    button.opt.active { border-color: var(--accent); color: var(--accent); background: #102428; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 5px 0; border-bottom: 1px solid var(--line); text-align: left; }
    td:last-child { text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
    .hud { position: fixed; left: 16px; bottom: 16px; color: var(--muted); font-size: 12px; z-index: 2; pointer-events: none; }
    .hint { color: var(--accent); font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="view"></div>
  <aside class="bar">
    <h1>AETHER Splice</h1>
    <p class="sub">Cuerpo partido · puertas en su bisagra</p>
    <label>Cuerpo</label>
    <div class="row">
      <button class="opt active" data-k="body" data-v="pylon">Pylon</button>
      <button class="opt" data-k="body" data-v="compact">VIP</button>
      <button class="opt" data-k="body" data-v="wall">Wall</button>
    </div>
    <label>Cara</label>
    <div class="row">
      <button class="opt active" data-k="face" data-v="ingreso">Ingreso</button>
      <button class="opt" data-k="face" data-v="salida">Salida</button>
    </div>
    <label>Puerta cara <span id="dfVal">0°</span></label>
    <input id="doorFront" type="range" min="0" max="90" value="0" />
    <label>Puerta servicio <span id="drVal">0°</span></label>
    <input id="doorRear" type="range" min="0" max="110" value="0" />
    <label>Despiece interno <span id="exVal">0%</span></label>
    <input id="explode" type="range" min="0" max="100" value="0" />
    <label>Vista</label>
    <div class="row">
      <button class="opt" data-k="view" data-v="iso">Iso</button>
      <button class="opt" data-k="view" data-v="front">Frente</button>
      <button class="opt" data-k="view" data-v="side">Perfil</button>
    </div>
    <label>Ayudas</label>
    <div class="row">
      <button class="opt active" id="btnCotas">Cotas</button>
      <button class="opt" id="btnIsla">Isla 150</button>
    </div>
    <p class="hint" id="hingeHint">Pylon: cara bisagra izquierda (no invade el auto). Servicio: bisagra derecha trasera.</p>
  </aside>
  <section class="spec">
    <label style="margin-top:0">Modelo</label>
    <h1 id="title">Pylon · ingreso</h1>
    <p class="sub" id="blurb"></p>
    <table id="dims"></table>
    <p class="sub" id="unique"></p>
  </section>
  <div class="hud">Clic en una puerta para abrirla · arrastra para orbitar</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const SPECS = {
      pylon: {
        name: "Pylon", H: 1620, Wf: 380, Wr: 240, D: 300, ph: 36,
        plate: [460, 12, 380], lcd: 1280, btn: 1120, slot: 1000, scan: 1080,
        faceH: 640, bolts: "4 × M12 · 320×250",
        hingeFront: "izquierda vertical", hingeRear: "derecha trasera"
      },
      compact: {
        name: "Compact VIP", H: 1280, Wf: 290, Wr: 190, D: 230, ph: 28,
        plate: [360, 10, 290], lcd: 1020, btn: 880, slot: 780, scan: 850,
        faceH: 540, bolts: "4 × M10 · 230×180",
        hingeFront: "izquierda vertical", hingeRear: "derecha trasera"
      },
      wall: {
        name: "Wall", H: 540, Wf: 320, Wr: 320, D: 150, ph: 0,
        plate: [500, 8, 300], lcd: 360, btn: 230, slot: 150, scan: 210,
        faceH: 480, bolts: "4 × M8 · fondo 820 mm",
        hingeFront: "superior (abre hacia arriba)", hingeRear: "sin puerta trasera"
      }
    };

    const state = { body: "pylon", face: "ingreso", explode: 0, cotas: true, isla: false };
    const doors = { front: 0, rear: 0, frontT: 0, rearT: 0 };
    const nodes = {};
    const clickables = [];

    const matBody = new THREE.MeshStandardMaterial({ color: 0x7d8893, metalness: 0.42, roughness: 0.38 });
    const matFace = new THREE.MeshStandardMaterial({ color: 0x22282e, metalness: 0.25, roughness: 0.48 });
    const matCap = new THREE.MeshStandardMaterial({ color: 0x9aa4ae, metalness: 0.5, roughness: 0.32 });
    const matSteel = new THREE.MeshStandardMaterial({ color: 0x5c656e, metalness: 0.6, roughness: 0.4 });
    const matCyan = new THREE.MeshStandardMaterial({ color: 0x3ee0d8, emissive: 0x3ee0d8, emissiveIntensity: 1.7, roughness: 0.22 });
    const matAmber = new THREE.MeshStandardMaterial({ color: 0xe8a020, emissive: 0xe8a020, emissiveIntensity: 1.15, roughness: 0.28 });
    const matSlot = new THREE.MeshStandardMaterial({ color: 0x101418, roughness: 0.55 });
    const matInner = new THREE.MeshStandardMaterial({ color: 0x3a424a, metalness: 0.2, roughness: 0.65 });
    const matIsla = new THREE.MeshStandardMaterial({ color: 0xd4b43a, roughness: 0.85 });
    const matHover = new THREE.MeshStandardMaterial({ color: 0x3ee0d8, emissive: 0x144844, emissiveIntensity: 0.35, metalness: 0.3, roughness: 0.4 });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2430);
    const camera = new THREE.PerspectiveCamera(32, 1, 10, 20000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById("view").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.HemisphereLight(0xe8eef4, 0x3a4654, 1.3));
    const key = new THREE.DirectionalLight(0xffffff, 2.05);
    key.position.set(1400, 2200, 1600);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = key.shadow.camera.bottom = -1800;
    key.shadow.camera.right = key.shadow.camera.top = 1800;
    key.shadow.camera.far = 6000;
    scene.add(key);
    scene.add(new THREE.DirectionalLight(0xb9d4e8, 0.9).translateX(-1600).translateY(900).translateZ(600));
    scene.add(new THREE.DirectionalLight(0x7adfd8, 0.5).translateX(200).translateY(800).translateZ(-1400));

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ color: 0x151c24, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const grid = new THREE.GridHelper(5000, 50, 0x6a8498, 0x3a5164);
    grid.position.y = 1;
    scene.add(grid);

    let rig = new THREE.Group();
    scene.add(rig);
    const dimGroup = new THREE.Group();
    scene.add(dimGroup);

    function mesh(geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }
    function rbox(w, h, d, mat, x, y, z, r = 3) {
      return mesh(new RoundedBoxGeometry(w, h, d, 2, r), mat, x, y, z);
    }
    function edges(m, c = 0x4e5964) {
      m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 18), new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.32 })));
      return m;
    }
    function hingePin(len) {
      const g = new THREE.CylinderGeometry(4, 4, len, 10);
      const m = new THREE.Mesh(g, matCyan);
      return m;
    }
    function screenTex(face) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 320;
      const g = c.getContext("2d");
      g.fillStyle = "#07141c"; g.fillRect(0, 0, 512, 320);
      g.strokeStyle = "#3ee0d8"; g.strokeRect(12, 12, 488, 296);
      g.fillStyle = "#3ee0d8";
      g.font = "bold 40px Segoe UI, sans-serif";
      g.fillText(face === "ingreso" ? "BIENVENIDO" : "PRESENTE", 36, 88);
      g.font = "26px Segoe UI, sans-serif";
      g.fillStyle = "#9fd9d5";
      g.fillText(face === "ingreso" ? "Pulse y tome ticket" : "el codigo al lector", 36, 136);
      g.fillStyle = "#1d3a40"; g.fillRect(36, 190, 440, 7);
      g.fillStyle = "#3ee0d8"; g.fillRect(36, 190, 200, 7);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    function sprite(text) {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 96;
      const g = c.getContext("2d");
      g.fillStyle = "#d7e2ea";
      g.font = "600 40px Segoe UI, sans-serif";
      g.textBaseline = "middle";
      g.fillText(text, 8, 48);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      spr.scale.set(120, 45, 1);
      spr.center.set(0, 0.5);
      return spr;
    }
    function spliceProfile(wf, wr, d) {
      const s = new THREE.Shape();
      s.moveTo(-wf / 2, d * 0.5);
      s.lineTo(wf / 2, d * 0.5);
      s.lineTo(wr / 2, -d * 0.18);
      s.lineTo(0, -d * 0.5);
      s.lineTo(-wr / 2, -d * 0.18);
      s.closePath();
      return s;
    }
    function mastGeo(wf, wr, d, h) {
      const geo = new THREE.ExtrudeGeometry(spliceProfile(wf, wr, d), {
        depth: h, bevelEnabled: true, bevelThickness: 5, bevelSize: 5, bevelSegments: 1, curveSegments: 1
      });
      geo.rotateX(-Math.PI / 2);
      return geo;
    }

    function build() {
      scene.remove(rig);
      rig = new THREE.Group();
      scene.add(rig);
      dimGroup.clear();
      clickables.length = 0;
      Object.keys(nodes).forEach((k) => delete nodes[k]);

      const s = SPECS[state.body];
      const wall = state.body === "wall";
      const y0 = wall ? 0 : s.plate[1];
      const bodyH = wall ? s.H : s.H - s.ph;
      const accent = state.face === "ingreso" ? matCyan : matAmber;

      const plate = rbox(s.plate[0], s.plate[1], s.plate[2], matSteel, 0, s.plate[1] / 2, 0, 4);
      edges(plate, 0x8a949c);
      rig.add(plate);
      nodes.plate = plate;

      if (!wall) {
        const plinth = mesh(mastGeo(s.Wf + 10, s.Wr + 10, s.D + 8, s.ph), matBody, 0, y0, 0);
        plinth.castShadow = true;
        rig.add(plinth);
        rig.add(rbox(s.Wf - 50, 5, 7, matCyan, 0, y0 + 14, s.D / 2 - 2, 1));
      }

      const shell = mesh(mastGeo(s.Wf, s.Wr, s.D, bodyH), matBody, 0, y0 + (wall ? 0 : s.ph), 0);
      shell.castShadow = true;
      shell.receiveShadow = true;
      edges(shell);
      rig.add(shell);
      nodes.shell = shell;

      const cap = mesh(mastGeo(s.Wf + 6, s.Wr + 4, s.D + 8, 14), matCap, 0, y0 + (wall ? bodyH : s.ph + bodyH), 0);
      cap.rotation.x = -0.08;
      cap.position.z += 8;
      cap.castShadow = true;
      edges(cap, 0x9aa3aa);
      rig.add(cap);
      nodes.cap = cap;

      const faceW = s.Wf - 36;
      const faceH = s.faceH;
      const faceY = wall
        ? y0 + 40 + faceH / 2
        : (s.lcd + (state.face === "ingreso" ? s.slot : s.scan)) / 2;
      const faceZ = s.D / 2 + 2;

      const pivotY = wall ? faceY + faceH / 2 : faceY;
      const frontPivot = new THREE.Group();
      if (wall) {
        frontPivot.position.set(0, pivotY, faceZ);
      } else {
        frontPivot.position.set(-faceW / 2, pivotY, faceZ);
      }
      rig.add(frontPivot);
      nodes.frontPivot = frontPivot;

      const frontDoor = rbox(faceW, faceH, 16, matFace, wall ? 0 : faceW / 2, wall ? -faceH / 2 : 0, 8, 4);
      frontDoor.userData.part = "front";
      clickables.push(frontDoor);
      frontPivot.add(frontDoor);
      nodes.frontDoor = frontDoor;

      const pin = hingePin(faceH - 20);
      if (wall) {
        pin.rotation.z = Math.PI / 2;
        pin.position.set(0, 0, 8);
      } else {
        pin.position.set(0, 0, 8);
      }
      frontPivot.add(pin);

      const lcd = new THREE.Mesh(new THREE.PlaneGeometry(148, 90), new THREE.MeshStandardMaterial({
        map: screenTex(state.face), emissive: 0x123038, emissiveIntensity: 0.5, roughness: 0.2
      }));
      lcd.position.set(wall ? 0 : faceW / 2, s.lcd - pivotY, 17);
      frontPivot.add(lcd);

      if (state.face === "ingreso") {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(26, 4, 10, 32), matCyan);
        ring.position.set(wall ? 0 : faceW / 2, s.btn - pivotY, 18);
        frontPivot.add(ring);
        const core = new THREE.Mesh(new THREE.CylinderGeometry(16, 16, 8, 24), matCyan);
        core.rotation.x = Math.PI / 2;
        core.position.copy(ring.position);
        frontPivot.add(core);
        const glow = new THREE.PointLight(0x3ee0d8, 1.15, 340);
        glow.position.copy(ring.position);
        frontPivot.add(glow);
        const mouth = rbox(112, 18, 10, matSlot, wall ? 0 : faceW / 2, s.slot - pivotY, 16, 2);
        frontPivot.add(mouth);
        const chev = new THREE.Mesh(new THREE.ConeGeometry(10, 16, 3), matCyan);
        chev.rotation.z = Math.PI;
        chev.position.set(mouth.position.x, mouth.position.y, 24);
        frontPivot.add(chev);
      } else {
        const win = rbox(118, 50, 8, matSlot, wall ? 0 : faceW / 2, s.scan - pivotY, 16, 2);
        frontPivot.add(win);
        const frame = rbox(130, 62, 3, matCyan, wall ? 0 : faceW / 2, win.position.y, 12, 1);
        frontPivot.add(frame);
      }

      const blade = rbox(7, bodyH * 0.72, 8, accent, s.Wf / 2 - 10, y0 + (wall ? bodyH * 0.48 : s.ph + bodyH * 0.45), s.D / 2 - 8, 1);
      rig.add(blade);
      nodes.blade = blade;

      const rearPivot = new THREE.Group();
      nodes.rearPivot = rearPivot;
      if (!wall) {
        const rearH = bodyH - 100;
        rearPivot.position.set(s.Wr / 2 - 6, y0 + s.ph + rearH / 2 + 20, -s.D / 2 + 8);
        rig.add(rearPivot);
        const rearDoor = rbox(s.Wr - 20, rearH, 12, matBody, -(s.Wr - 20) / 2, 0, -6, 3);
        rearDoor.userData.part = "rear";
        clickables.push(rearDoor);
        rearPivot.add(rearDoor);
        nodes.rearDoor = rearDoor;
        const rpin = hingePin(rearH - 30);
        rpin.position.set(0, 0, -6);
        rearPivot.add(rpin);
      } else {
        const back = rbox(s.Wf - 10, bodyH - 20, 8, matSteel, 0, bodyH / 2, -s.D / 2 - 2, 2);
        rig.add(back);
      }

      const inn = new THREE.Group();
      inn.position.set(0, faceY - 40, 0);
      rig.add(inn);
      nodes.inn = inn;
      inn.add(rbox(s.Wf - 90, 90, 70, matInner, 0, -40, -20, 3));
      inn.add(rbox(120, 48, 80, matSteel, 0, state.face === "ingreso" ? -120 : -80, 10, 3));
      inn.add(rbox(90, 40, 50, matSteel, 50, 50, -30, 3));
      const rail = rbox(s.Wf - 120, 8, 40, matSteel, 0, 110, -40, 1);
      inn.add(rail);

      nodes.y0 = y0;
      nodes.s = s;
      nodes.wall = wall;
      nodes.faceY = faceY;

      if (state.isla && !wall) {
        rig.add(rbox(720, 150, 2400, matIsla, 0, -75, 180, 2));
        rig.position.y = 150;
      } else rig.position.y = 0;

      if (state.cotas) {
        const x = -540;
        const h = s.H;
        dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 0, 0), new THREE.Vector3(x, h, 0)]), new THREE.LineBasicMaterial({ color: 0xc5d2dc })));
        [0, 500, 1000, 1500, h].filter((v, i, a) => a.indexOf(v) === i && v <= h + 5).forEach((v) => {
          dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 16, v, 0), new THREE.Vector3(x + 16, v, 0)]), new THREE.LineBasicMaterial({ color: 0xc5d2dc })));
          const lab = sprite(String(Math.round(v)));
          lab.position.set(x + 24, v, 0);
          dimGroup.add(lab);
        });
      }

      document.getElementById("title").textContent = `${s.name} · ${state.face}`;
      document.getElementById("blurb").textContent = state.face === "ingreso"
        ? "LCD 7\" · anillo de pulso · boca de ticket"
        : "LCD 7\" · lector interno tras ventana";
      document.getElementById("dims").innerHTML = [
        ["Alto", `${s.H} mm`],
        ["Frente / cola", `${s.Wf} / ${s.Wr} mm`],
        ["Fondo", `${s.D} mm`],
        ["Bisagra cara", s.hingeFront],
        ["Bisagra servicio", s.hingeRear]
      ].map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("");
      document.getElementById("unique").textContent = "Planta en punta (no caja). Casco y servicio se abren en su bisagra real. El Wall abre la cara hacia arriba.";
      document.getElementById("hingeHint").textContent = wall
        ? "Wall: clic en la cara — bisagra superior, abre como visera."
        : "Clic en la cara (bisagra izq.) o en la tapa trasera (bisagra der.).";
      document.getElementById("doorRear").disabled = wall;

      applyPose();
    }

    function applyPose() {
      const s = nodes.s;
      if (!s || !nodes.frontPivot) return;
      const wall = nodes.wall;
      const e = state.explode;
      if (wall) nodes.frontPivot.rotation.set(-doors.front * 1.15, 0, 0);
      else {
        nodes.frontPivot.rotation.set(0, -doors.front * 1.45, 0);
        if (nodes.rearPivot) nodes.rearPivot.rotation.set(0, doors.rear * 1.65, 0);
      }
      if (nodes.inn) {
        nodes.inn.position.z = -10 + e * 220;
        nodes.inn.position.x = e * 80;
      }
      if (nodes.cap) nodes.cap.position.y = nodes.y0 + (wall ? s.H : s.ph + (s.H - s.ph)) + e * 90;
      if (nodes.blade) nodes.blade.position.x = s.Wf / 2 - 10 + e * 70;
      if (nodes.plate) nodes.plate.position.y = s.plate[1] / 2 - e * 70;
    }

    function setView(v) {
      const s = SPECS[state.body];
      const h = s.H * 0.45;
      const dist = Math.max(s.H * 2.35, 2800);
      if (v === "front") camera.position.set(0, h + 120, dist * 0.92);
      else if (v === "side") camera.position.set(dist * 0.92, h + 120, 80);
      else camera.position.set(dist * 0.72, s.H * 0.58, dist * 0.95);
      controls.target.set(0, h, 0);
    }

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    document.querySelectorAll("button.opt[data-k]").forEach((b) => {
      b.addEventListener("click", () => {
        const k = b.dataset.k, v = b.dataset.v;
        if (k === "view") { setView(v); return; }
        document.querySelectorAll(`button.opt[data-k="${k}"]`).forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        state[k] = v;
        doors.front = doors.frontT = 0;
        doors.rear = doors.rearT = 0;
        document.getElementById("doorFront").value = 0;
        document.getElementById("doorRear").value = 0;
        document.getElementById("dfVal").textContent = "0°";
        document.getElementById("drVal").textContent = "0°";
        build();
      });
    });
    document.getElementById("doorFront").addEventListener("input", (ev) => {
      doors.frontT = ev.target.value / 90;
      document.getElementById("dfVal").textContent = ev.target.value + "°";
    });
    document.getElementById("doorRear").addEventListener("input", (ev) => {
      doors.rearT = ev.target.value / 110;
      document.getElementById("drVal").textContent = ev.target.value + "°";
    });
    document.getElementById("explode").addEventListener("input", (ev) => {
      state.explode = ev.target.value / 100;
      document.getElementById("exVal").textContent = ev.target.value + "%";
      if (state.explode > 0.05) {
        doors.frontT = Math.max(doors.frontT, Math.min(1, state.explode * 1.1));
        doors.rearT = Math.max(doors.rearT, Math.min(1, state.explode * 1.1));
        document.getElementById("doorFront").value = Math.round(doors.frontT * 90);
        document.getElementById("doorRear").value = Math.round(doors.rearT * 110);
        document.getElementById("dfVal").textContent = document.getElementById("doorFront").value + "°";
        document.getElementById("drVal").textContent = document.getElementById("doorRear").value + "°";
      }
      applyPose();
    });
    document.getElementById("btnCotas").addEventListener("click", (ev) => {
      state.cotas = !state.cotas;
      ev.currentTarget.classList.toggle("active", state.cotas);
      build();
    });
    document.getElementById("btnIsla").addEventListener("click", (ev) => {
      state.isla = !state.isla;
      ev.currentTarget.classList.toggle("active", state.isla);
      build();
    });

    const ray = new THREE.Raycaster();
    const ptr = new THREE.Vector2();
    let hover = null, down = null;
    function pick(ev) {
      const r = renderer.domElement.getBoundingClientRect();
      ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
      ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(ptr, camera);
      return ray.intersectObjects(clickables, false)[0];
    }
    renderer.domElement.addEventListener("pointerdown", (ev) => {
      const hit = pick(ev);
      down = hit ? { part: hit.object.userData.part, x: ev.clientX, y: ev.clientY } : null;
    });
    renderer.domElement.addEventListener("pointerup", (ev) => {
      if (!down) return;
      if (Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) { down = null; return; }
      if (down.part === "front") {
        doors.frontT = doors.frontT > 0.5 ? 0 : 1;
        document.getElementById("doorFront").value = Math.round(doors.frontT * 90);
        document.getElementById("dfVal").textContent = document.getElementById("doorFront").value + "°";
      }
      if (down.part === "rear") {
        doors.rearT = doors.rearT > 0.5 ? 0 : 1;
        document.getElementById("doorRear").value = Math.round(doors.rearT * 110);
        document.getElementById("drVal").textContent = document.getElementById("doorRear").value + "°";
      }
      down = null;
    });
    renderer.domElement.addEventListener("pointermove", (ev) => {
      const hit = pick(ev);
      const obj = hit ? hit.object : null;
      if (hover && hover !== obj) hover.material = hover.userData.part === "front" ? matFace : matBody;
      hover = obj;
      if (hover) {
        hover.material = matHover;
        renderer.domElement.style.cursor = "pointer";
      } else renderer.domElement.style.cursor = "default";
    });

    window.addEventListener("resize", resize);
    resize();
    setView("iso");
    build();
    (function tick() {
      doors.front += (doors.frontT - doors.front) * 0.14;
      doors.rear += (doors.rearT - doors.rear) * 0.14;
      applyPose();
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
