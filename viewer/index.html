<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AETHER Lane — visor 3D</title>
  <style>
    :root {
      --bg: #1a2430;
      --panel: rgba(22, 30, 40, 0.88);
      --line: #3d4d5c;
      --text: #f2f6f8;
      --muted: #a8b4bf;
      --accent: #3ee0d8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    #view { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .bar {
      position: fixed; z-index: 2; top: 16px; left: 16px; width: 268px;
      background: var(--panel); border: 1px solid var(--line); padding: 16px;
      backdrop-filter: blur(10px);
    }
    .spec {
      position: fixed; z-index: 2; top: 16px; right: 16px; width: 250px;
      background: var(--panel); border: 1px solid var(--line); padding: 16px;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
    label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button.opt {
      flex: 1 1 auto;
      background: #121820;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 8px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    button.opt.active { border-color: var(--accent); color: var(--accent); background: #102428; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 5px 0; border-bottom: 1px solid var(--line); text-align: left; }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
    .hud { position: fixed; left: 16px; bottom: 16px; color: var(--muted); font-size: 12px; z-index: 2; pointer-events: none; }
    @media (max-width: 820px) {
      .bar, .spec { position: relative; width: auto; margin: 8px; }
      body { overflow: auto; }
      #view { position: relative; height: 70vh; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <aside class="bar">
    <h1>AETHER Lane</h1>
    <p class="sub">Kiosko ingreso / salida · mm</p>
    <label>Cuerpo</label>
    <div class="row">
      <button class="opt active" data-k="body" data-v="pylon">Pylon</button>
      <button class="opt" data-k="body" data-v="compact">VIP</button>
      <button class="opt" data-k="body" data-v="wall">Wall</button>
    </div>
    <label>Cara</label>
    <div class="row">
      <button class="opt active" data-k="face" data-v="ingreso">Ingreso</button>
      <button class="opt" data-k="face" data-v="salida">Salida</button>
    </div>
    <label>Despiece <span id="exVal">0%</span></label>
    <input id="explode" type="range" min="0" max="100" value="0" />
    <label>Vista</label>
    <div class="row">
      <button class="opt" data-k="view" data-v="iso">Iso</button>
      <button class="opt" data-k="view" data-v="front">Frente</button>
      <button class="opt" data-k="view" data-v="side">Perfil</button>
    </div>
    <label>Ayudas</label>
    <div class="row">
      <button class="opt active" id="btnCotas">Cotas</button>
      <button class="opt" id="btnIsla">Isla 150</button>
    </div>
  </aside>
  <section class="spec">
    <label style="margin-top:0">Modelo</label>
    <h1 id="title">Pylon · ingreso</h1>
    <p class="sub" id="blurb"></p>
    <table id="dims"></table>
  </section>
  <div class="hud">Arrastra para orbitar · rueda zoom · clic derecho pan</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const SPECS = {
      pylon: {
        name: "Pylon", H: 1620, Wf: 360, Wr: 300, D: 280, ph: 40, plate: [440, 14, 360],
        lcd: 1320, btn: 1160, slot: 1040, scan: 1100, inter: 1460,
        ckW: 300, ckH: 560, visor: 28, bolts: "4 × M12 · 300×240"
      },
      compact: {
        name: "Compact VIP", H: 1280, Wf: 280, Wr: 240, D: 220, ph: 32, plate: [340, 12, 280],
        lcd: 1060, btn: 920, slot: 820, scan: 880, inter: 1160,
        ckW: 240, ckH: 480, visor: 22, bolts: "4 × M10 · 220×180"
      },
      wall: {
        name: "Wall", H: 520, Wf: 300, Wr: 300, D: 140, ph: 0, plate: [480, 8, 280],
        lcd: 360, btn: 240, slot: 160, scan: 210, inter: 460,
        ckW: 260, ckH: 420, visor: 18, bolts: "4 × M8 · fondo 820 mm"
      }
    };

    const state = { body: "pylon", face: "ingreso", explode: 0, cotas: true, isla: false };

    const matBody = new THREE.MeshStandardMaterial({ color: 0x8d949c, metalness: 0.28, roughness: 0.42 });
    const matFace = new THREE.MeshStandardMaterial({ color: 0x2c3238, metalness: 0.2, roughness: 0.55 });
    const matCap = new THREE.MeshStandardMaterial({ color: 0xa4aab0, metalness: 0.35, roughness: 0.38 });
    const matSteel = new THREE.MeshStandardMaterial({ color: 0x6e767e, metalness: 0.55, roughness: 0.4 });
    const matCyan = new THREE.MeshStandardMaterial({ color: 0x3ee0d8, emissive: 0x3ee0d8, emissiveIntensity: 1.6, roughness: 0.25 });
    const matAmber = new THREE.MeshStandardMaterial({ color: 0xe8a020, emissive: 0xe8a020, emissiveIntensity: 1.1, roughness: 0.3 });
    const matSlot = new THREE.MeshStandardMaterial({ color: 0x111418, metalness: 0.1, roughness: 0.6 });
    const matIsla = new THREE.MeshStandardMaterial({ color: 0xd4b43a, roughness: 0.85, metalness: 0.05 });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2430);

    const camera = new THREE.PerspectiveCamera(32, 1, 10, 20000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById("view").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.HemisphereLight(0xe8eef4, 0x3a4654, 1.35));
    const key = new THREE.DirectionalLight(0xffffff, 2.1);
    key.position.set(1400, 2200, 1600);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 200;
    key.shadow.camera.far = 6000;
    key.shadow.camera.left = key.shadow.camera.bottom = -1800;
    key.shadow.camera.right = key.shadow.camera.top = 1800;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xb9d4e8, 0.95);
    fill.position.set(-1600, 900, 600);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0x7adfd8, 0.55);
    rim.position.set(200, 800, -1400);
    scene.add(rim);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(8000, 8000),
      new THREE.MeshStandardMaterial({ color: 0x151c24, roughness: 1, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const grid = new THREE.GridHelper(5000, 50, 0x6a8498, 0x3a5164);
    grid.position.y = 1;
    scene.add(grid);

    let rig = new THREE.Group();
    scene.add(rig);
    const dimGroup = new THREE.Group();
    scene.add(dimGroup);

    function box(w, h, d, mat, x, y, z, r = 2) {
      const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, r), mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    function edges(mesh, color = 0x5a6570) {
      const e = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry, 20),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 })
      );
      mesh.add(e);
      return mesh;
    }

    function screenTex(face) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 320;
      const g = c.getContext("2d");
      const lg = g.createLinearGradient(0, 0, 0, 320);
      lg.addColorStop(0, "#0b1a22");
      lg.addColorStop(1, "#061014");
      g.fillStyle = lg;
      g.fillRect(0, 0, 512, 320);
      g.fillStyle = "#3ee0d8";
      g.font = "bold 44px Segoe UI, sans-serif";
      g.fillText(face === "ingreso" ? "BIENVENIDO" : "PRESENTE", 36, 90);
      g.font = "28px Segoe UI, sans-serif";
      g.fillStyle = "#9fd9d5";
      g.fillText(face === "ingreso" ? "Tome su ticket" : "el codigo", 36, 140);
      g.fillStyle = "#1d3a40";
      g.fillRect(36, 180, 440, 8);
      g.fillStyle = "#3ee0d8";
      g.fillRect(36, 180, face === "ingreso" ? 180 : 280, 8);
      g.font = "20px Segoe UI, sans-serif";
      g.fillStyle = "#7a9098";
      g.fillText("AETHER  ·  7\" LCD", 36, 250);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function sprite(text, scale = 140) {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 96;
      const g = c.getContext("2d");
      g.clearRect(0, 0, 256, 96);
      g.fillStyle = "#d7e2ea";
      g.font = "600 42px Segoe UI, sans-serif";
      g.textAlign = "left";
      g.textBaseline = "middle";
      g.fillText(text, 8, 48);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      spr.scale.set(scale, scale * 0.37, 1);
      spr.center.set(0, 0.5);
      return spr;
    }

    function heightRuler(h) {
      const g = new THREE.Group();
      const x = -520;
      const pts = [new THREE.Vector3(x, 0, 0), new THREE.Vector3(x, h, 0)];
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xc5d2dc })));
      const ticks = [0, 500, 1000, 1500].filter((v) => v <= h + 20);
      if (!ticks.includes(h)) ticks.push(h);
      ticks.forEach((v) => {
        g.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x - 18, v, 0), new THREE.Vector3(x + 18, v, 0)]),
          new THREE.LineBasicMaterial({ color: 0xc5d2dc })
        ));
        const lab = sprite(String(v), 120);
        lab.position.set(x + 28, v, 0);
        g.add(lab);
      });
      return g;
    }

    function build() {
      scene.remove(rig);
      rig = new THREE.Group();
      scene.add(rig);
      dimGroup.clear();

      const s = SPECS[state.body];
      const wall = state.body === "wall";
      const e = state.explode;
      const bodyY = wall ? 0 : s.ph;
      const bodyH = wall ? s.H : s.H - s.ph;
      const accent = state.face === "ingreso" ? matCyan : matAmber;

      const plate = box(s.plate[0], s.plate[1], s.plate[2], matSteel, 0, s.plate[1] / 2 - e * 80, 0, 4);
      edges(plate, 0x8a949c);
      rig.add(plate);

      if (!wall) {
        const plinth = box(s.Wf + 8, s.ph, s.D + 8, matBody, 0, s.ph / 2 + s.plate[1] * 0.5, 0, 3);
        edges(plinth);
        rig.add(plinth);
        const kick = box(s.Wf - 40, 6, 8, matCyan, 0, 28, s.D / 2 + 2);
        rig.add(kick);
      }

      const shell = box(s.Wf, bodyH, s.D, matBody, 0, bodyY + bodyH / 2 + (wall ? 0 : s.plate[1] * 0.35), 0, 6);
      edges(shell);
      rig.add(shell);

      const cap = box(s.Wf + 8, 16, s.D + 10, matCap, 0, bodyY + bodyH + 6 + e * 90 + (wall ? 0 : s.plate[1] * 0.35), 4, 3);
      edges(cap, 0x9aa3aa);
      rig.add(cap);

      const yOff = wall ? 0 : s.plate[1] * 0.35;
      const faceZ = s.D / 2 + 2 + e * 70;
      const face = box(s.ckW, s.ckH, 16, matFace, 0, s.lcd - 40 + yOff, faceZ, 4);
      edges(face, 0x111416);
      rig.add(face);

      const lcdMat = new THREE.MeshStandardMaterial({
        map: screenTex(state.face),
        emissive: 0x123038,
        emissiveIntensity: 0.55,
        roughness: 0.18,
        metalness: 0.05
      });
      const lcd = new THREE.Mesh(new THREE.PlaneGeometry(150, 94), lcdMat);
      lcd.position.set(0, s.lcd + yOff, faceZ + 9 + e * 90);
      rig.add(lcd);

      if (state.face === "ingreso") {
        const btn = new THREE.Mesh(new THREE.CylinderGeometry(28, 28, 14, 40), matCyan);
        btn.rotation.x = Math.PI / 2;
        btn.position.set(0, s.btn + yOff, faceZ + 12 + e * 110);
        btn.castShadow = true;
        rig.add(btn);
        const glow = new THREE.PointLight(0x3ee0d8, 1.4, 380);
        glow.position.copy(btn.position);
        rig.add(glow);
        const slot = box(118, 22, 14, matSlot, 0, s.slot + yOff, faceZ + 10 + e * 130, 2);
        rig.add(slot);
        const lip = box(126, 6, 4, matCap, 0, s.slot + 16 + yOff, faceZ + 16 + e * 130, 1);
        rig.add(lip);
      } else {
        const win = box(120, 52, 10, matSlot, 0, s.scan + yOff, faceZ + 10 + e * 110, 2);
        rig.add(win);
        const ring = box(132, 64, 3, matCyan, 0, s.scan + yOff, faceZ + 5 + e * 100, 1);
        rig.add(ring);
        const glow = new THREE.PointLight(0x3ee0d8, 1.2, 360);
        glow.position.set(0, s.scan + yOff, faceZ + 20);
        rig.add(glow);
      }

      const blade = box(6, bodyH * 0.55, 8, accent, s.Wf / 2 - 4, bodyY + bodyH * 0.42 + yOff, s.D / 2 + 1 - e * 40, 1);
      rig.add(blade);

      if (e > 0.08) {
        rig.add(box(160, 70, 90, matSteel, 0, s.slot + yOff, -20 + e * 40, 3));
        rig.add(box(110, 46, 54, matSteel, 80 + e * 140, bodyY + 140 + yOff, -30, 3));
      }

      if (state.isla && !wall) {
        const isle = box(720, 150, 2400, matIsla, 0, -75, 180, 2);
        rig.add(isle);
        rig.position.y = 150;
      } else {
        rig.position.y = 0;
      }

      if (state.cotas) dimGroup.add(heightRuler(s.H + (wall ? 0 : s.plate[1])));

      fillSpec(s);
    }

    function fillSpec(s) {
      document.getElementById("title").textContent = `${s.name} · ${state.face}`;
      document.getElementById("blurb").textContent = state.face === "ingreso"
        ? "LCD 7\" + botón + ticket 80 mm"
        : "LCD 7\" + lector barcode interno";
      const rows = [
        ["Alto", `${s.H} mm`],
        ["Frente", `${s.Wf} mm`],
        ["Fondo", `${s.D} mm`],
        ["LCD", `${s.lcd} mm`],
        [state.face === "ingreso" ? "Botón" : "Lector", `${state.face === "ingreso" ? s.btn : s.scan} mm`],
        [state.face === "ingreso" ? "Slot" : "Anclaje", state.face === "ingreso" ? `${s.slot} mm` : s.bolts]
      ];
      document.getElementById("dims").innerHTML = rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("");
    }

    function setView(v) {
      const s = SPECS[state.body];
      const h = s.H * 0.45;
      const dist = Math.max(s.H * 2.35, 2800);
      if (v === "front") camera.position.set(0, h + 120, dist * 0.92);
      else if (v === "side") camera.position.set(dist * 0.92, h + 120, 80);
      else camera.position.set(dist * 0.72, s.H * 0.58, dist * 0.95);
      controls.target.set(0, h, 0);
    }

    function resize() {
      const w = innerWidth, h = innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    document.querySelectorAll("button.opt[data-k]").forEach((b) => {
      b.addEventListener("click", () => {
        const k = b.dataset.k, v = b.dataset.v;
        if (k === "view") { setView(v); return; }
        document.querySelectorAll(`button.opt[data-k="${k}"]`).forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        state[k] = v;
        build();
      });
    });
    document.getElementById("explode").addEventListener("input", (ev) => {
      state.explode = ev.target.value / 100;
      document.getElementById("exVal").textContent = ev.target.value + "%";
      build();
    });
    document.getElementById("btnCotas").addEventListener("click", (ev) => {
      state.cotas = !state.cotas;
      ev.currentTarget.classList.toggle("active", state.cotas);
      build();
    });
    document.getElementById("btnIsla").addEventListener("click", (ev) => {
      state.isla = !state.isla;
      ev.currentTarget.classList.toggle("active", state.isla);
      build();
    });

    window.addEventListener("resize", resize);
    resize();
    setView("iso");
    build();
    (function tick() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
